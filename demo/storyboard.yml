version: "1.0"

project:
  name: SpectreGram
  description: A desktop audio spectrum analyser that renders a full-track spectrogram and tells you whether a "lossless" file is really a lossy file in disguise.
  repository: https://github.com/lanly-dev/SpectreGram

theme:
  mood: spooky
  avatar: ghost
  props: [lamp, banner, sign]

metadata:
  target_audience: Audio enthusiasts and collectors

scenes:
  - type: title
    title: SpectreGram
    tagline: Is that lossless file a 128k MP3 in a costume? Let the ghost judge.
    background: assets/empty-state.png

  - type: feature
    visual: assets/analysed-track.png
    caption: Drop in a track and see its whole spectrogram with a verdict banner.
    narration: "You drop a track onto the window, and the whole song unfolds as a glowing spectrogram, with a dB legend down the side and a ruler along the bottom. Above it, a banner gives its estimate of the frequency cutoff and whether that is normal for the format. Click the ruler to cue playback from any moment, or drag across it to zoom into one stretch and look again."

  - type: callout
    visual: assets/costume-verdict.png
    caption: A WAV that stops at 15.7 kHz gives itself away as a lossy file.
    narration: "This file swore it was a lossless WAV. But real lossless audio climbs high into the treble, and this one stops near 15.7 kHz, just where a 128k MP3 would. The ghost was not fooled: the verdict reads Costume. Other files may be judged genuine, inconclusive or plainly lossy."
    callouts:
      - x: 0.615
        y: 0.12
        label: The COSTUME verdict chip
      - x: 0.2
        y: 0.5
        label: Sharp cutoff near 15.7 kHz
      - x: 0.36
        y: 0.55
        label: Text hidden in the spectrogram

  - type: callout
    visual: assets/folder-scan-rating.png
    caption: Scan a whole folder and get a collector rating for the lot.
    narration: "Then you point it at a whole folder. One click on Scan, and every file is judged, subfolders and all. At the end comes your rating, anywhere from Crypt Keeper down to Costume Party Noob, with a count for each verdict. You can keep the findings as a Markdown report."
    callouts:
      - x: 0.68
        y: 0.49
        label: The collector rating
      - x: 0.75
        y: 0.63
        label: Counts per verdict
      - x: 0.37
        y: 0.79
        label: Save a Markdown report

  - type: callout
    visual: assets/spectral-message.png
    caption: Hide a short message in the spectrogram of a new WAV.
    narration: "Some nights call for mischief. Haunt writes up to 32 characters of text, or shapes, into the spectrogram of a brand-new WAV, and leaves your original untouched. Here a row of Halloween silhouettes hides inside the music, and the verdict stays a calm Inconclusive."
    callouts:
      - x: 0.38
        y: 0.55
        label: Silhouettes cut into the spectrogram
      - x: 0.735
        y: 0.66
        label: Time and frequency under the cursor
      - x: 0.69
        y: 0.2
        label: The verdict stays inconclusive, not lossy

  - type: code
    caption: Run it from source with two commands.
    narration: "Want to summon it yourself? SpectreGram is an Electron app. Install its dependencies, start the dev loop, and the desktop app appears, with hot reload."
    code:
      language: sh
      snippet: |
        npm install
        npm run dev
      highlight_lines: [2]

  - type: outro
    caption: SpectreGram is open source under the MIT licence.
    narration: "And so the ghost lays down its lantern. The code, the README and the releases all live in the repository. SpectreGram was built for Kiroween 2026."
