version: "1.0"

project:
  name: SpectreGram
  description: A desktop audio spectrum analyser that renders a full-track spectrogram and tells you whether a "lossless" file is really a lossy file in disguise.
  repository: https://github.com/lanly-dev/SpectreGram

theme:
  mood: spooky
  avatar: ghost
  props: [lamp, banner, sign]

metadata:
  target_audience: Audio enthusiasts and collectors

scenes:
  - type: title
    title: SpectreGram
    tagline: Is that lossless file a 128k MP3 in a costume? Let the ghost judge.
    background: assets/empty-state.png

  - type: feature
    visual: assets/analysed-track.png
    caption: Drop in a track and see its whole spectrogram with a verdict banner.
    narration: SpectreGram renders the full track as a spectrogram, with a dB legend and a ruler. The banner above it estimates the frequency cutoff and says whether that is normal for the format. Click the ruler to seek and cue playback, or drag to zoom into a segment and re-analyse it.

  - type: callout
    visual: assets/costume-verdict.png
    caption: A WAV that stops at 15.7 kHz gives itself away as a lossy file.
    narration: Real lossless audio reaches high frequencies. This WAV is cut off near 15.7 kHz, which is typical of a 128k MP3, so the verdict reads Costume. Verdicts range from genuine to inconclusive, costume and lossy.
    callouts:
      - x: 0.615
        y: 0.12
        label: The COSTUME verdict chip
      - x: 0.2
        y: 0.5
        label: Sharp cutoff near 15.7 kHz
      - x: 0.36
        y: 0.55
        label: Text hidden in the spectrogram

  - type: callout
    visual: assets/folder-scan-rating.png
    caption: Scan a whole folder and get a collector rating for the lot.
    narration: One click on Scan judges every file in a folder, subfolders included. The result is a rating, from Crypt Keeper down to Costume Party Noob, with counts per verdict. You can save the result as a Markdown report.
    callouts:
      - x: 0.68
        y: 0.49
        label: The collector rating
      - x: 0.75
        y: 0.63
        label: Counts per verdict
      - x: 0.37
        y: 0.79
        label: Save a Markdown report

  - type: callout
    visual: assets/spectral-message.png
    caption: Hide a short message in the spectrogram of a new WAV.
    narration: The Haunt feature writes up to 32 characters of text, or shapes, into the spectrogram of a new WAV file. The original file is never changed, and the verdict stays safe. Here, pumpkin, ghost, bat and spider silhouettes are cut into the spectrum.
    callouts:
      - x: 0.38
        y: 0.55
        label: Silhouettes cut into the spectrogram
      - x: 0.735
        y: 0.66
        label: Time and frequency under the cursor
      - x: 0.69
        y: 0.2
        label: The verdict stays inconclusive, not lossy

  - type: code
    caption: Run it from source with two commands.
    narration: SpectreGram is an Electron app. Install the dependencies, then start the dev loop, which launches the desktop app with hot reload.
    code:
      language: sh
      snippet: |
        npm install
        npm run dev
      highlight_lines: [2]

  - type: outro
    caption: SpectreGram is open source under the MIT licence.
    narration: Find the code, the README and the releases in the repository. SpectreGram was built for Kiroween 2026.
